[project]
name = "aml-detection-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "catboost>=1.2.10",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "pandas>=2.2,<3",
    "pyspark[sql]>=4.3.0",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
